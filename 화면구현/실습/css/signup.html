<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 페이지</title>
    <style>
      body {
        background-color: #f5f5f5;
        font-family: sans-serif;
      }
      .register-container {
        width: 500px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .form-row label {
        width: 80px;
      }

      .form-row input[type="text"],
      .form-row input[type="password"] {
        width: 200px;
        padding: 8px;
        border: 1px solid #ccc;
      }

      .button-group {
        display: flex;
        justify-content: center;
        gap: 10px;
        magin-top: 30px;
      }

      .button-group button {
        padding: 10px 25px;
        cursor: pointer;
      }

      .btn-join {
        background-color: #2d6a4f;
        color: white;
        border: none;
      }

      .btn-cancel {
        background-color: white;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="form-row">
        <label>아이디</label>
        <input type="text" />
        <button>중복확인</button>
      </div>

      <div class="form-row">
        <label>비밀번호</label>
        <input type="password" />
      </div>

      <div class="form-row">
        <label>이메일</label>
        <input type="text" />
        <span>@</span>
        <select>
          <option>naver.com</option>
          <option>gmail.com</option>
          <option>daum.net</option>
          <option>직접입력</option>
        </select>
      </div>

      <div class="form-row">
        <label>주소</label>
        <input type="text" />
      </div>

      <div class="form-row">
        <label>성별</label>
        <label><input type="radio" name="gender" /> 남성</label>
        <label><input type="radio" name="gender" /> 여성</label>
      </div>

      <div class="button-group">
        <button>회원가입</button>
        <button>취소</button>
      </div>
    </div>
  </body>
</html>
