<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #f5f5f5;
      }

      header {
        justify-content: space-between;
        display: flex;
        align-items: center;

        background-color: black;
        padding: 0 40px;
        height: 80px;
      }

      .logo {
        color: white;
      }

      input {
        width: 300px;
        height: 40px;
        padding-left: 10px;
      }

      nav {
        display: flex;
        gap: 20px;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <h2 class="logo">LOGO</h2>

      <input type="text" placeholder="Search" />
      <nav>
        <a href="#">Login</a>
        <a href="#">join</a>
      </nav>
    </header>
  </body>
</html>
