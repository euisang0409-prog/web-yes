<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #f5f5f5;
      }
      header {
        height: 80px;
        background: #222;
        justify-content: space-between;
        display: flex;
        align-items: center;
        padding: 0 40px;
      }

      .logo {
        font-size: 28px;
        color: white;
      }
      nav {
        display: flex;
        gap: 30px;
      }

      nav a {
        text-decoration: none;
        color: white;
      }

      .hero {
        text-align: center;
        padding: 80px;
      }

      h2 {
        text-align: center;
        margin-bottom: 15px;
      }

      .but {
        width: 180px;

        height: 50px;

        border: none;

        border-radius: 8px;

        background: royalblue;

        color: white;

        font-size: 18px;

        cursor: pointer;

        transition: 0.3s;
      }
      .products {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
      }

      .card {
        width: 300px;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateX(-10px);
      }

      footer {
        height: 70px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="logo">Logo</h1>

      <nav>
        <ul>
          <li>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Shop</a>
            <a href="#">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="hero">
        <h2>Welcome to Shopping Mall</h2>
        <p>Best Products for Everyone</p>

        <button class="but">Shop Now</button>
      </div>

      <h2>Featured Products</h2>

      <section class="products">
        <div class="card">
          <img src="이미지" alt="쇼핑몰" />

          <h1>Keyboard</h1>
          <p>39,000</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="이미지" alt="쇼핑몰" />
          <h1>Keyboard</h1>
          <p>39,000</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="이미지" alt="쇼핑몰" />
          <h1>Keyboard</h1>
          <p>39,000</p>
          <button>Buy Now</button>
        </div>
      </section>
    </main>

    <footer>Copyright &copy; 2026</footer>
  </body>
</html>
