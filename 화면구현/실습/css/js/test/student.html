<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      // 학생 정보를 관리하는 프로그램 만들기
      // 학생 1명의 정보는 객체로 관리한다.
      // 이름, 과목, 점수 세가지 속성이 존재한다.
      // 여러명의 학생은 배열로 관리한다.

      // 페이지가 처음 열릴 때 students 배열에 들어있는 학생 목록 출력하기
      // 이름 / 과목 / 점수

      // 학생 추가하기
      // 정보를 입력하고 버튼을 누르면 새로운 학생을 만들어 배열에 추가하기

      // 입력값 검사
      // 이름, 과목, 점수가 비어있는 경우 "모든 값을 입력하세요"

      // 점수가 60점 이상이면 합격, 60점 미만이면 불합격을 목록 뒤에 함께 출력하기
      // 학생 데이터 담을 빈 배열
      let students = [];

      // 학생 추가 함수
      function addStudent() {
        // 입력창
        const name = document.getElementById("name").value;
        const major = document.getElementById("major").value;
        const score = document.getElementById("score").value;

        // 빈칸 확인
        if (!name || !major || !score) {
          alert("모든 칸을 채워주세요!");
          return;
        }

        // 새로운 학생 객체
        const newStudent = { name, major, score };

        // 배열 추가
        students.push(newStudent);

        renderTable();

        // 입력창을 비웁니다
        document.getElementById("name").value = "";
        document.getElementById("major").value = "";
        document.getElementById("score").value = "";
      }

      function renderTable() {
        let table = `
          <tr>
            <th>이름</th>
            <th>과목</th>
            <th>점수</th>
            <th>결과</th>
          </tr>
        `;
        for (let i = 0; i < students.length; i++) {
          table += `
        <tr>
            <td>${students[i].name}</td>
            <td>${students[i].major}</td>
            <td>${students[i].score}</td>
            <td>${students[i].score >= 60 ? "합격" : "불합격"}</td>
        </tr>`;
        }
        document.getElementById("studentTable").innerHTML = table;
      }
      window.onload = function () {
        renderTable();
      };
    </script>
  </head>
  <body>
    <!-- 이름, 과목, 점수 입력칸 -->
    <h2>학생 정보 관리</h2>
    <input type="text" id="name" placeholder="이름입력" />
    <br />
    <input type="text" id="major" placeholder="과목 입력" />
    <br />
    <input type="text" id="score" placeholder="점수 입력" />

    <!-- 학생 추가 버튼 -->
    <button onclick="addStudent()">추가하기</button>
    <br />
    <!-- 수강생 목록 -->
    <table border="1" id="studentTable">
      <tr>
        <th>이름</th>
        <th>과목</th>
        <th>점수</th>
      </tr>
    </table>
  </body>
</html>
