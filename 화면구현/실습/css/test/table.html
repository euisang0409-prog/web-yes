<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border-collapse: collapse;
        width: 800px;
      }

      th,
      td {
        border: 1px solid #ccc;
        padding: 5px;
      }

      tr:first-child {
        background-color: #2c3e50;
        color: #ffffff;
      }

      tr:not(:first-child):not(:last-child):nth-child {
        background-color: #f8f9fa;
      }

      tr:not(:first-child):not(:last-child):hover {
        background-color: #ebf5fb;
        cursor: pointer;
      }

      tr:last-child {
        background-color: #eaeded;
        color: #2c3e50;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <table border="1">
      <h1>사원 성과 테이블</h1>

      <tr>
        <th>사원번호</th>
        <th>이름</th>
        <th>지급</th>
        <th>성과점수</th>
      </tr>

      <tr>
        <td>A001</td>
        <td>김철수</td>
        <td>팀장</td>
        <td>95점</td>
      </tr>
      <tr>
        <td>A002</td>
        <td>이영희</td>
        <td>대리</td>
        <td>88점</td>
      </tr>
      <tr>
        <td>A003</td>
        <td>박민수</td>
        <td>사원</td>
        <td>72점</td>
      </tr>
      <tr>
        <td>A004</td>
        <td>최지우</td>
        <td>사원</td>
        <td>84점</td>
      </tr>
      <tr>
        <td>총계</td>
        <td>4명</td>
        <td>-</td>
        <td>평균84.75점</td>
      </tr>
    </table>
  </body>
</html>
