<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <title>수강생 관리</title>
  </head>

  <body>
    <h1>교육 과정 수강생 등록</h1>

    <h3>등록</h3>

    이름

    <input type="text" id="name" />

    <br /><br />

    과정명

    <select id="course">
      <option value="">선택</option>

      <option value="자바 개발 과정">자바 개발 과정</option>

      <option value="스프링부트 개발">스프링부트 개발</option>

      <option value="프론트엔드 과정">프론트엔드 과정</option>
    </select>

    <br /><br />

    이메일

    <input type="email" id="email" />

    <br /><br />

    <button id="addBtn">수강생 등록</button>

    <hr />

    <h3>목록</h3>

    <button id="loadBtn">목록 조회</button>

    <br /><br />

    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>이름</th>
          <th>과정명</th>
          <th>이메일</th>
        </tr>
      </thead>

      <tbody id="studentList"></tbody>
    </table>

    <script src="student.js"></script>
  </body>
</html>
