<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width", initial-scale="1.0" />
    

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #f5f6f8;
        min-height: 40px, 20px;
      }
      
      .gallery-container {
        width: 1000px;
        margin: 0 auto;
      }
      
      .gallery-container h1{
        text-align: center;
        font-size: 28px;
      }

      .card-list{
        display: flex;
        gap : 20px;
        justify-content: center;
      }
      .card{
        width: 300px;
        background: #fff;
        border : 1px solid #ddd;
        padding: 16px;
      }

      .card img{
        width : 100%;
      }
      .card h2{
        font-size : 18px;
        color : #222;
      }

      .card p{
        font-size : 14px;
        color : #666;
        line-height: 1.5;
        margin-top : 10px;
      }
      
      .card button{
        background-color: #2d6a4f;
        color : #fff;
        border : 1px solid #2d6a4f;
        padding: 8px 16px;
        border-radius: 4px0;
        margin-top: 10px;

      }
    </style>
    <body>
      <div class="gallery-container">
        <h1>갤러리</h1>

        <!-- 카드 목록을 감싸는 div-->
        <div class="card-list">
         <div class="card">
            <img src="../img/dog.jpg" alt="봄 풍경" />
            <h2>봄 풍경</h2>
            <p>따듯한 봄날의 풍경입니다.</p>
            <button>자세히 보기</button>
        </div>

      <div class="card-list">
         <div class="card">
          <img src="../img/dog.jpg" alt="여름 바다" />
          <h2>여름 바다</h2>
          <p>시원하고 푸른 여름 바다입니다.</p>
          <button>자세히 보기</button>
        </div>

      <div class="card-list">
         <div class="card">
          <img src="../img/dog.jpg" alt="가을 단풍" />
          <h2>가을 단풍</h2>
          <p>붉게 물든 가을 단풍 풍경입니다.</p>
          <button>자세히 보기</button>
        </div>
      </div>
    </div> 
    </body>
  </head>
</html>
